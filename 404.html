<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found — Coral</title>
<meta name="description" content="That page does not exist. Head back to Coral.">
<meta name="theme-color" content="#000000">

<style>
:root{
  --bg:#000000; --surface-1:#181818;
  --text:#F5F5F7; --text-variant:#D2D2D4; --text-muted:#A1A1A3;
  --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.16);
  --s-25:2px; --s-50:4px; --s-75:8px; --s-100:12px; --s-200:16px;
  --s-300:24px; --s-400:32px; --s-500:40px; --s-600:48px;
  --s-700:64px; --s-800:80px; --s-900:96px;
  --r-md:12px; --r-lg:16px; --r-xl:24px; --r-full:9999px;
  --ease:cubic-bezier(.22,1,.36,1);
  --page:var(--s-600); --max:1120px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100svh;
  display:flex;flex-direction:column;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
::selection{background:#F5F5F7;color:#000}
:focus-visible{outline:2px solid rgba(245,245,247,.75);outline-offset:3px;border-radius:var(--r-full)}

.heading-1{font-size:60px;line-height:1;font-weight:600;letter-spacing:-.045em;text-wrap:balance}
.body-3{font-size:16px;line-height:24px;color:var(--text-variant);text-wrap:pretty}
.caption-5{font-size:12px;line-height:16px;color:var(--text-muted)}
.button-md{font-size:16px;line-height:24px;font-weight:600}

.wrap{width:100%;max-width:var(--max);margin:0 auto;padding-inline:var(--page)}

.nav{
  position:fixed;top:var(--s-200);left:50%;transform:translateX(-50%);z-index:100;
  display:flex;align-items:center;gap:var(--s-200);
  padding:var(--s-75) var(--s-300);
  border:1px solid var(--line);border-radius:var(--r-full);
  background:rgba(24,24,24,.72);
  -webkit-backdrop-filter:blur(20px) saturate(120%);
  backdrop-filter:blur(20px) saturate(120%);
}
.brand{display:inline-flex;align-items:center;gap:var(--s-100)}
.brand-mark{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--text);display:grid;place-items:center;flex:none}
.brand-mark::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--text)}
.brand-name{font-size:16px;font-weight:600;letter-spacing:-.02em}

main{flex:1;display:flex;align-items:center;padding-top:calc(var(--s-900) + var(--s-600));padding-bottom:var(--s-900)}
.stage{position:relative;max-width:640px}
.rings{position:absolute;left:-40%;top:50%;transform:translateY(-50%);width:60vmin;height:60vmin;pointer-events:none}
.rings span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.06);border-radius:50%}
.rings span:nth-child(1){width:100%;height:100%}
.rings span:nth-child(2){width:66%;height:66%}
.rings span:nth-child(3){width:34%;height:34%;border-color:rgba(255,255,255,.12)}
.content{position:relative;z-index:1}
.eyebrow{
  display:inline-flex;align-items:center;gap:var(--s-75);
  padding:var(--s-50) var(--s-100);border:1px solid var(--line);border-radius:var(--r-full);
  color:var(--text-muted);font-size:12px;line-height:16px;font-weight:500;
}
.eyebrow i{width:5px;height:5px;border-radius:50%;background:var(--text);opacity:.6}
h1{margin-top:var(--s-300)}
p{margin-top:var(--s-300);max-width:48ch;font-size:18px;line-height:28px;color:var(--text-muted);text-wrap:pretty}
.actions{display:flex;flex-wrap:wrap;gap:var(--s-100);margin-top:var(--s-500)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s-75);
  border-radius:var(--r-full);padding:var(--s-100) var(--s-300);
  transition:transform .5s var(--ease),background .3s var(--ease),border-color .3s var(--ease);
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--text);color:#000;box-shadow:0 12px 32px -14px rgba(255,255,255,.5)}
.btn-primary:hover{background:#FFFFFF;transform:translateY(-1px)}
.btn-ghost{border:1px solid var(--line);background:var(--surface-1)}
.btn-ghost:hover{background:#1F1F1F;border-color:var(--line-strong);transform:translateY(-1px)}

footer{padding-block:var(--s-400) var(--s-500)}
.footer-in{display:flex;align-items:center;justify-content:space-between;gap:var(--s-300);flex-wrap:wrap}
.footer-links{display:flex;gap:var(--s-25);flex-wrap:wrap}
.footer-links a{font-size:14px;line-height:20px;color:var(--text-muted);padding:var(--s-75) var(--s-100);border-radius:var(--r-full)}
.footer-links a:hover{color:var(--text);background:rgba(255,255,255,.05)}

@media (max-width:900px){
  :root{--page:var(--s-300)}
  .heading-1{font-size:36px;line-height:40px}
}
@media (max-width:640px){
  :root{--page:var(--s-200)}
  .rings{display:none}
  .footer-in{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>

<header class="nav">
  <a class="brand" href="index.html" aria-label="Coral, home">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">Coral</span>
  </a>
</header>

<main>
  <div class="wrap">
    <div class="stage">
      <div class="rings" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="content">
        <span class="eyebrow"><i aria-hidden="true"></i> Error 404</span>
        <h1 class="heading-1">This track skipped.</h1>
        <p>The page you asked for is not here. It may have moved, or the link may have a typo in it.</p>
        <div class="actions">
          <a class="btn btn-primary button-md" href="index.html">Back to Coral</a>
          <a class="btn btn-ghost button-md" href="index.html#faq">Read the FAQ</a>
        </div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap footer-in">
    <p class="caption-5">&copy; 2026 Coral. Designed and built by Rajat.</p>
    <nav class="footer-links" aria-label="Elsewhere and legal">
      <a href="https://t.me/rajat_xo" target="_blank" rel="noopener">Telegram</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </nav>
  </div>
</footer>

</body>
</html>
